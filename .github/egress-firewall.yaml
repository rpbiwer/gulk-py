# Experiment: which ref is the egress policy read from on pull_request_review?
# Marker hosts are added in separate commits so each candidate ref differs:
#   base  -> api.github.com (added on actions-setup AFTER the PR branch forks)
#   head  -> pypi.org       (added on the PR branch)
#   merge -> both
# The spacer comments keep the two insertions far enough apart to merge cleanly.
mode: enforce
allow:
  # [base marker goes directly below this line]
  - api.github.com
  #
  #
  #
  #
  - release-assets.githubusercontent.com
  #
  #
  #
  #
  # [head marker goes directly below this line]
