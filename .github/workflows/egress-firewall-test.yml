name: Egress firewall test

on:
  push:
  workflow_dispatch:

jobs:
  allowed:
    name: Allow list covers install and tests
    runs-on: ubuntu-24.04-firewall
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: make test
        working-directory: packages/gulk-lib

  blocked:
    name: Non-allowlisted host is denied
    runs-on: ubuntu-24.04-firewall
    steps:
      - name: Allowed host is reachable
        run: curl --fail --silent --show-error --output /dev/null https://api.github.com
      - name: Non-allowlisted host is blocked
        run: |
          if curl --fail --silent --show-error --max-time 20 --output /dev/null https://example.com; then
            echo "::error::example.com was reachable; egress firewall is not enforcing"
            exit 1
          fi

  blocked-ip:
    name: IP literal connections are denied
    runs-on: ubuntu-24.04-firewall
    steps:
      # --insecure so a failure can only come from the firewall or the network,
      # not from a certificate mismatch on an IP literal.
      - name: IPv4 literal is blocked (HTTPS and HTTP)
        run: |
          for url in https://1.1.1.1 http://1.1.1.1; do
            if curl --ipv4 --fail --silent --insecure --max-time 20 --output /dev/null "$url"; then
              echo "::error::$url was reachable; IP literal egress is not blocked"
              exit 1
            fi
          done
      - name: IPv6 literal is blocked (HTTPS and HTTP)
        run: |
          if ! ip -6 route get 2606:4700:4700::1111 > /dev/null 2>&1; then
            echo "::warning::Runner has no IPv6 route; skipping, a failure here would prove nothing"
            exit 0
          fi
          for url in "https://[2606:4700:4700::1111]" "http://[2606:4700:4700::1111]"; do
            if curl --ipv6 --fail --silent --insecure --max-time 20 --output /dev/null "$url"; then
              echo "::error::$url was reachable; IPv6 literal egress is not blocked"
              exit 1
            fi
          done
