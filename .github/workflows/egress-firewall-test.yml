name: Egress firewall test

on:
  push:
  workflow_dispatch:

jobs:
  allowed:
    name: Allow list covers install and tests
    runs-on: ubuntu-24.04-firewall
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: make test
        working-directory: packages/gulk-lib

  blocked:
    name: Non-allowlisted host is denied
    runs-on: ubuntu-24.04-firewall
    steps:
      - name: Allowed host is reachable
        run: curl --fail --silent --show-error --output /dev/null https://api.github.com
      - name: Non-allowlisted host is blocked
        run: |
          if curl --fail --silent --show-error --max-time 20 --output /dev/null https://example.com; then
            echo "::error::example.com was reachable; egress firewall is not enforcing"
            exit 1
          fi
