# Native Actions egress firewall policy (technical preview).
# Must live at .github/egress-firewall.yaml, on the ref the workflow runs from.
# Defaults already allow github.com, codeload.github.com, *.actions.githubusercontent.com
# and *blob.core.windows.net.
mode: enforce
allow:
  # - api.github.com
  - release-assets.githubusercontent.com
  - pypi.org
  - files.pythonhosted.org
